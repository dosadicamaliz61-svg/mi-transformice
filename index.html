<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Transformice Independiente</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #1c333d; overflow: hidden;
        }
        #flash-container {
            width: 100%; height: 100%;
        }
        #flash-container ruffle-player {
            width: 100%; height: 100%;
        }
    </style>
    <!-- Ruffle oficial para Google Chrome -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div id="flash-container"></div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            document.getElementById("flash-container").appendChild(player);

            player.config = {
                allowScriptAccess: true,
                preferredRenderer: "webgl",
                
                socketProxy: [
                    {
                        host: "://transformice.com",
                        port: 443,
                        proxyUrl: "wss://tfmproxy.threej.in" 
                    }
                ],
                letterbox: "on",
                quality: "low"
            };

            // Enlace directo corregido (Raw) para evitar el error 'Failed to fetch'
            player.load("https://githubusercontent.com");
        });
    </script>
</body>
</html>
